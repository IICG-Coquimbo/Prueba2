{% extends 'base.html' %}
{% block title %}Sin permiso - Cafe Rincon{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 text-center">
    <h1 class="text-primario">403</h1>
    <p>No tienes permiso para ver esta pagina.</p>
    {% url 'inicio' as url_inicio %}
    {% if url_inicio %}
      <a href="{{ url_inicio }}" class="btn btn-primario">Ir al inicio</a>
    {% endif %}
  </div>
</div>
{% endblock %}
