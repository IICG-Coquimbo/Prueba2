{% extends "base.html" %}
{% load static %}
{% block title %}Iniciar sesion{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Iniciar sesion</h3>
                <form method="post" class="px-3 pb-3">
                    {% csrf_token %}
                    {% if form.non_field_errors %}
                    <div class="alert alert-danger mb-3">{{ form.non_field_errors }}</div>
                    {% endif %}
                    {% for campo in form.visible_fields %}
                    <div class="mb-3">
                        <label class="form-label" for="{{ campo.id_for_label }}}{{ campo.label }}{% if campo.field.required %} *{% endif %}</label>
                        {{ campo }}
                        {% for error in campo.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
                    </div>
                    {% endfor %}
                    <div class="d-grid gap-2 mt-3">
                        <button type="submit" class="btn btn-primary">Entrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
