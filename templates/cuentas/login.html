{% extends "base.html" %}
{% block title %}Iniciar sesion - Cafe Rincon{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header text-center">
                <h4>Iniciar sesion</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% include "parciales/form_campos.html" %}
                    <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">Entrar</button>
                </form>
                <div class="text-center mt-3">
                    <p class="mb-0">No tienes cuenta? <a href="{% url 'cuentas:registro' %}">Registrate</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
