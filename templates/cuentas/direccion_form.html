{% extends "base.html" %}
{% block title %}{% if object %}Editar{% else %}Nueva{% endif %} direccion - Cafe Rincon{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">{% if object %}Editar{% else %}Nueva{% endif %} direccion</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% include "parciales/form_campos.html" %}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Guardar</button>
                        <a href="{% url 'cuentas:direccion_list' %}" class="btn btn-outline-secondary btn-lg">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
