{% extends "base.html" %}
{% block title %}Borrar direccion - Cafe Rincon{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Confirmar eliminacion</h4>
            </div>
            <div class="card-body text-center">
                <i class="bi bi-trash display-1 text-danger"></i>
                <p class="mt-3">¿Estas seguro de eliminar la direccion <strong>{{ object.alias }}</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-danger btn-lg">Si, eliminar</button>
                        <a href="{% url 'cuentas:direccion_list' %}" class="btn btn-outline-secondary btn-lg">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
