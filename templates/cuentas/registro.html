{% extends "base.html" %}
{% block title %}Registro - Cafe Rincon{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header text-center">
                <h4>Crear cuenta</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% include "parciales/form_campos.html" %}
                    <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">Registrarse</button>
                </form>
                <div class="text-center mt-3">
                    <p class="mb-0">Ya tienes cuenta? <a href="{% url 'cuentas:login' %}">Inicia sesion</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
