{% extends "base.html" %}
{% load static %}

{% block title %}Accion - Cafe Rincon{% endblock %}

{% block content %}
<div class="row mt-4 justify-content-center">
    <div class="col-12 col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title">{{ view.get_title|default:"Accion" }}</h2>
                <form method="post">
                    {% csrf_token %}
                    {% include "parciales/form_campos.html" %}
                    <button type="submit" class="btn btn-primary btn-lg w-100">Ejecutar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
