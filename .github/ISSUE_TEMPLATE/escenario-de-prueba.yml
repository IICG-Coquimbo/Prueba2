name: Escenario de prueba
description: Un escenario de prueba de usuario (una fila de la planilla Quiz)
title: "[TS_00] "
labels: ["escenario-de-prueba", "estado:SP"]
body:
  - type: markdown
    attributes:
      value: |
        Un issue = un escenario de prueba (TS_01, TS_02...). Los casos de
        prueba van como lista de tareas. La evidencia (capturas) va en los
        comentarios, un comentario por ejecucion.
  - type: dropdown
    id: sprint
    attributes:
      label: Sprint
      options: ["Sprint 1", "Sprint 2", "Sprint 3", "Sprint 4"]
    validations:
      required: true
  - type: input
    id: id_escenario
    attributes:
      label: ID del escenario
      placeholder: TS_01
    validations:
      required: true
  - type: input
    id: requerimientos
    attributes:
      label: Requerimientos que cubre (ids exactos del archivo de requerimientos)
      placeholder: RF-03, RF-05, RF-15
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: Descripcion del escenario
    validations:
      required: true
  - type: dropdown
    id: importancia
    attributes:
      label: Importancia
      options: ["Alta", "Media", "Baja"]
    validations:
      required: true
  - type: dropdown
    id: etapa
    attributes:
      label: Etapa en que se prueba
      options: ["Etapa 1 - Modelos y admin", "Etapa 2 - Vistas (como superusuario)", "Etapa 3 - Usuarios y roles"]
    validations:
      required: true
  - type: textarea
    id: casos
    attributes:
      label: Casos de prueba (una tarea por caso)
      description: "Escribe una linea por caso, empezando con - [ ]. GitHub calcula el porcentaje de avance con las tareas marcadas."
      placeholder: |
        - [ ] CP-01: ...
        - [ ] CP-02: ...
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Precondiciones, pasos y resultado esperado
      description: "Usuario con que se ejecuta, datos necesarios, una accion por linea y lo que se espera ver."
    validations:
      required: true
