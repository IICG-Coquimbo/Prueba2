{% extends "base.html" %}
{% load static %}

{% block title %}Borrar entrega - Cafe Rincon{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-12 col-md-6">
        <h2>Borrar entrega</h2>
        <p>¿Estas seguro de que quieres borrar la entrega de pedido #{{ object.pedido.pk }}?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-lg w-100">Confirmar borrado</button>
            <a href="{% url 'entregas:entrega_list' %}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
