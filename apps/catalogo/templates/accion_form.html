{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <h1>{{ titulo }}</h1>
    {% if producto %}<p class="lead">{{ producto.nombre }}</p>{% endif %}

    <form method="post">
        {% csrf_token %}
        {% include "parciales/form_campos.html" %}
        {% if perms.pedidos.add_pedido %}
        <button type="submit" class="btn btn-lg btn-primary w-100">Agregar al carrito</button>
        {% endif %}
    </form>
</div>
{% endblock %}
