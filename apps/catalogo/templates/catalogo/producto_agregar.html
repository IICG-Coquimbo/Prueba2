{% extends "base.html" %}
{% block content %}
<h2>Agregar "{{ producto.nombre }}" al carrito</h2>
<form method="post">
    {% csrf_token %}
    {% include "parciales/form_campos.html" %}
    <button type="submit" class="btn btn-primary btn-lg w-100">Agregar al carrito</button>
</form>
<a href="{% url 'catalogo:producto_detail' producto.pk %}" class="btn btn-secondary mt-2">Volver</a>
{% endblock %}
