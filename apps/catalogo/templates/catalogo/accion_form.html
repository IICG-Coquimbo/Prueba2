{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Agregar al carrito</h1>
        <form method="post">
          {% csrf_token %}
          {% include "parciales/form_campos.html" %}
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg">Confirmar</button>
            <a class="btn btn-outline-secondary btn-lg" href="{% url 'catalogo:producto_list' %}">Volver</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
