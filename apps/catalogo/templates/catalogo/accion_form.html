{% extends "base.html" %}

{% block title %}{{ titulo }} | Cafe Rincon{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">{{ titulo }}</h1>
        <form method="post">
          {% csrf_token %}
          {% include "parciales/form_campos.html" %}
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primario btn-lg">{{ boton }}</button>
            <a href="{{ cancelar_url }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
