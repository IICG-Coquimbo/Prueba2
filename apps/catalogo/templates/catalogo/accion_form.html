{% extends 'base.html' %}
{% block title %}Agregar al carrito - Cafe Rincon{% endblock %}
{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2>Agregar al carrito</h2>
      <p><strong>{{ producto.nombre }}</strong> - ${{ producto.precio|floatformat:"0g" }}</p>
      <form method="post">
        {% csrf_token %}
        {% include "parciales/form_campos.html" %}
        <button type="submit" class="btn btn-primary btn-lg w-100">Agregar al carrito</button>
        <a href="{% url 'catalogo:producto_detail' producto.pk %}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
