{% extends "base.html" %}
{% block content %}
  <h1>Agregar al carrito</h1>
  <p class="lead">{{ producto.nombre }} - ${{ producto.precio|floatformat:"0g" }}</p>
  <form method="post" action="{% url 'catalogo:producto_agregar' producto.pk %}">
    {% csrf_token %}
    {% include "parciales/form_campos.html" %}
    <button type="submit" class="btn btn-lg btn-cafe">Agregar al carrito</button>
  </form>
  <p><a href="{% url 'catalogo:producto_detail' producto.pk %}">Volver al producto</a></p>
{% endblock %}
