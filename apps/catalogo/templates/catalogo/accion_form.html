{% extends "base.html" %}
{% block title %}Agregar al carrito{% endblock %}
{% block content %}
<div class="container">
  <h1>Agregar al carrito</h1>
  <form method="post">
    {% csrf_token %}
    {% include "parciales/form_campos.html" %}
    <button type="submit" class="btn btn-primary btn-lg w-100">Agregar</button>
  </form>
  <a class="btn btn-link" href="{% url 'catalogo:producto_list' %}">Cancelar</a>
</div>
{% endblock %}
