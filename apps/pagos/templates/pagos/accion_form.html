{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <h1>{{ titulo }}</h1>
    <p class="fs-5">Monto: ${{ pago.monto|floatformat:"0g" }}</p>
    <p class="text-muted">Referencia: {{ pago.referencia }}</p>
    <p>No se solicitan numeros de tarjeta</p>

    <form method="post">
        {% csrf_token %}
        {% include "parciales/form_campos.html" %}
        <button type="submit" class="btn btn-lg w-100 btn-primary">Enviar resultado</button>
    </form>
</div>
{% endblock %}
