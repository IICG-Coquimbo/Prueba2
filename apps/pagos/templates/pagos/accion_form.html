{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Pasarela de pago</h1>
        {% if pago %}
        <p class="mb-1"><strong>Referencia:</strong> {{ pago.referencia }}</p>
        <p class="fs-5 mb-4"><strong>Monto:</strong> ${{ pago.monto|floatformat:"0g" }}</p>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          {% include "parciales/form_campos.html" %}
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg">Enviar resultado</button>
            <a class="btn btn-outline-secondary btn-lg" href="{% url 'pedidos:pedido_detail' pago.pedido_id %}">Volver al pedido</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
