{% extends "base.html" %}

{% block title %}Pasarela de pago{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h2>Pasarela de pago (simulada)</h2>
    <p>Referencia: {{ pago.referencia }}</p>
    <p>Monto: ${{ pago.monto|floatformat:"0g" }}</p>
    <form method="post" action="{% url 'pagos:pasarela' pago.referencia %}">
      {% csrf_token %}
      {% include "parciales/form_campos.html" %}
      <button type="submit" class="btn btn-primario btn-lg w-100">Confirmar pago</button>
    </form>
  </div>
</div>
{% endblock %}
