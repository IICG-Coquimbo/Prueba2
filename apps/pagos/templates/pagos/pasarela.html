{% extends "base.html" %}
{% block content %}
  <h1>Pasarela de pago</h1>
  <p class="lead">Pedido #{{ pago.pedido_id }} — Monto a pagar: ${{ pago.monto|floatformat:"0g" }}</p>
  <p>Referencia: <code>{{ pago.referencia }}</code></p>

  <form method="post">
    {% csrf_token %}
    {% include "parciales/form_campos.html" %}
    <button type="submit" class="btn btn-lg btn-cafe w-100">Confirmar pago</button>
  </form>

  <p class="mt-3"><a href="{% url 'pedidos:pedido_detail' pago.pedido_id %}">Volver al pedido</a></p>
{% endblock %}
