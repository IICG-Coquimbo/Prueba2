{% extends 'base.html' %}
{% block title %}Cambiar estado - Pedido {{ pedido.pk }}{% endblock %}
{% block content %}
<h2>Cambiar estado - Pedido #{{ pedido.pk }}</h2>
<p><strong>Estado actual:</strong> {{ pedido.get_estado_display }}</p>
<form method="post" action="">
    {% csrf_token %}
    {% include "parciales/form_campos.html" %}
    <button type="submit" class="btn btn-primary btn-lg w-100">Cambiar estado</button>
</form>
<a href="{% url 'pedidos:pedido_detail' pedido.pk %}" class="btn btn-secondary">Cancelar</a>
{% endblock %}
