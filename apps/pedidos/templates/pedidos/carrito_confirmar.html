{% extends "base.html" %}

{% block title %}Confirmar pedido{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h2>Confirmar pedido</h2>
    <form method="post" action="{% url 'pedidos:carrito_confirmar' %}">
      {% csrf_token %}
      {% include "parciales/form_campos.html" %}
      <button type="submit" class="btn btn-primario btn-lg w-100">Confirmar</button>
    </form>
  </div>
</div>
{% endblock %}
