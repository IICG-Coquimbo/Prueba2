{% extends "base.html" %}

{% block content %}
<h2>Mis pedidos</h2>
<div class="table-responsive">
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Estado</th>
        <th>Total</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      {% for p in pedidos %}
      <tr>
        <td>{{ p.creado|date:"d/m/Y H:i" }}</td>
        <td>{{ p.get_estado_display }}</td>
        <td>${{ p.total|floatformat:"0g" }}</td>
        <td>
          <a href="{% url 'pedidos:pedido_detail' p.pk %}" class="btn btn-sm btn-info">Ver</a>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="4">No tienes pedidos registrados.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
