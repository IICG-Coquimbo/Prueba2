{% extends "base.html" %}
{% load static %}

{% block title %}Nuevo item de pedido - Cafe Rincon{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-12 col-md-8">
        <h2>Nuevo item de pedido</h2>
        <form method="post">
            {% csrf_token %}
            {% include "parciales/form_campos.html" %}
            <button type="submit" class="btn btn-primary btn-lg w-100">Crear</button>
            <a href="{% url 'pedidos:pedido_list' %}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
