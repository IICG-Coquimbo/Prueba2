{% extends "base.html" %}

{% block title %}{{ titulo }} | Café Rincón{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 mb-3">{{ titulo }}</h1>
          <form method="post">
            {% csrf_token %}
            {% include "parciales/form_campos.html" %}
            <button type="submit" class="btn btn-primary btn-lg w-100">{{ boton_texto }}</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
