{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <h1>{{ titulo }}</h1>
    {% if pedido %}<p class="lead">Pedido #{{ pedido.pk }} - {{ pedido.get_estado_display }}</p>{% endif %}

    <form method="post">
        {% csrf_token %}
        {% include "parciales/form_campos.html" %}
        <button type="submit" class="btn btn-lg btn-primary w-100">{{ titulo }}</button>
    </form>
</div>
{% endblock %}
