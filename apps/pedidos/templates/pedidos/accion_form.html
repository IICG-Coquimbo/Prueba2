{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="container">
  <h1>{{ titulo }}</h1>
  <form method="post">
    {% csrf_token %}
    {% include "parciales/form_campos.html" %}
    <button type="submit" class="btn btn-primary btn-lg w-100">{{ accion }}</button>
  </form>
  <a class="btn btn-link" href="{% url 'pedidos:pedido_list' %}">Cancelar</a>
</div>
{% endblock %}
