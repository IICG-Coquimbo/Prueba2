{% extends "base.html" %}

{% block content %}
<h2>Confirmar pedido</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="mb-3">
    <label for="id_direccion" class="form-label">Dirección</label>
    <select class="form-select" id="id_direccion" name="direccion" required>
      {% for dir in direcciones %}
        <option value="{{ dir.pk }}">{{ dir.alias }}: {{ dir.direccion }}</option>
      {% empty %}
        <option value="">No tienes direcciones registradas. <a href="{% url 'cuentas:direccion_add' %}">Agregar dirección</a>.</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label>Método de pago</label><br>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="metodo_pago" id="efectivo" value="efectivo" required>
      <label class="form-check-label" for="efectivo">Efectivo</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="metodo_pago" id="tarjeta" value="tarjeta" required>
      <label class="form-check-label" for="tarjeta">Tarjeta</label>
    </div>
  </div>
  <button type="submit" class="btn btn-lg btn-success w-100">Confirmar</button>
</form>
{% endblock %}
