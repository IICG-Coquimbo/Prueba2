{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <h1>Borrar direccion</h1>
    <p>¿Seguro que deseas borrar la direccion "{{ object.alias }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-lg btn-danger w-100">Borrar</button>
        <a class="btn btn-lg btn-secondary w-100 mt-2" href="{% url 'cuentas:direccion_list' %}">Cancelar</a>
    </form>
</div>
{% endblock %}
