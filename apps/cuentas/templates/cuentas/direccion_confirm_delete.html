{% extends "base.html" %}
{% block title %}Borrar dirección | Cafe Rincon{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h4 mb-3">Borrar dirección</h1>
<p>¿Seguro que deseas borrar <strong>{{ object.alias }}</strong>?</p>
<form method="post">{% csrf_token %}
<div class="d-grid gap-2"><button type="submit" class="btn btn-danger btn-lg">Sí, borrar</button>
{% url 'cuentas:direccion_list' as url_volver %}{% if url_volver %}<a href="{{ url_volver }}" class="btn btn-outline-secondary">Cancelar</a>{% endif %}
</div></form></div></div></div></div>
{% endblock %}
