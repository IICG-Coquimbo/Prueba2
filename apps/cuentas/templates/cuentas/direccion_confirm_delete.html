{% extends "base.html" %}

{% block title %}Borrar direccion{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h2>Borrar direccion</h2>
    <p>¿Estas seguro de que quieres borrar la direccion "{{ object.alias }}"?</p>
    <form method="post" action="">
      {% csrf_token %}
      {% include "parciales/form_campos.html" %}
      <button type="submit" class="btn btn-danger">Borrar</button>
    </form>
    <a href="{% url 'cuentas:direccion_list' %}" class="btn btn-outline-secondary">Cancelar</a>
  </div>
</div>
{% endblock %}
