{% extends 'base.html' %}
{% block title %}Borrar direccion{% endblock %}
{% block content %}
<h2>Borrar direccion</h2>
<p>¿Estas seguro de que quieres borrar la direccion "{{ object.alias }}"?</p>
<form method="post" action="">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger btn-lg">Borrar</button>
</form>
<a href="{% url 'cuentas:direccion_list' %}" class="btn btn-secondary">Cancelar</a>
{% endblock %}
