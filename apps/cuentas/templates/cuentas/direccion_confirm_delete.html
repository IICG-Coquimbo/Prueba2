{% extends "base.html" %}
{% block title %}Borrar dirección - Cafe Rincon{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <h1 class="h3 mb-4">Borrar dirección</h1>
      <p>¿Estás seguro de borrar la dirección "{{ object.alias }}"?</p>
      <form method="post">
        {% csrf_token %}
        {% include "parciales/form_campos.html" %}
        <button type="submit" class="btn btn-danger btn-lg">Borrar</button>
        <a href="{% url 'cuentas:direccion_list' %}" class="btn btn-secondary">Cancelar</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
