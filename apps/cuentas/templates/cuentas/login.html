{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <h1 class="h3 mb-4">Iniciar sesion</h1>
    <form method="post" action="{% url 'cuentas:login' %}">
      {% csrf_token %}
      {% include "parciales/form_campos.html" %}
      <button type="submit" class="btn btn-primario btn-lg w-100">Iniciar sesion</button>
    </form>
    <p class="mt-3">No tienes cuenta? <a href="{% url 'cuentas:registro' %}">Registrate</a></p>
  </div>
</div>
{% endblock %}
