{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title mb-4">Iniciar sesion</h2>
                <form method="post">
                    {% csrf_token %}
                    {% include "parciales/form_campos.html" %}
                    <button type="submit" class="btn btn-primary w-100 btn-lg">Ingresar</button>
                </form>
            </div>
        </div>
        <p class="text-center mt-3">¿No tienes cuenta? <a href="{% url 'cuentas:registro' %}">Regístrate</a></p>
    </div>
</div>
{% endblock %}
