{% extends "base.html" %}
{% load static %}

{% block title %}Iniciar sesion - Cafe Rincon{% endblock %}

{% block content %}
<div class="row mt-4 justify-content-center">
    <div class="col-12 col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="card-title text-center">Iniciar sesion</h2>
                <form method="post">
                    {% csrf_token %}
                    {% include "parciales/form_campos.html" %}
                    <button type="submit" class="btn btn-primary btn-lg w-100">Iniciar sesion</button>
                </form>
                <p class="text-center mt-3">
                    ¿No tienes cuenta? <a href="{% url 'cuentas:registro' %}">Regístrate</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
