{% extends "base.html" %}

{% block title %}Iniciar sesion{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2>Iniciar sesion</h2>
    <form method="post" action="{% url 'cuentas:login' %}">
      {% csrf_token %}
      {% include "parciales/form_campos.html" %}
      <button type="submit" class="btn btn-primario btn-lg w-100">Iniciar sesion</button>
    </form>
    <p class="mt-3">
      ¿No tienes cuenta? <a href="{% url 'cuentas:registro' %}">Regístrate</a>
    </p>
  </div>
</div>
{% endblock %}
