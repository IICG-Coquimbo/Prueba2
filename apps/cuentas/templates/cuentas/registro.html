{% extends "base.html" %}

{% block title %}Registro | Cafe Rincon{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4 text-center">Crear cuenta</h1>
        <form method="post">
          {% csrf_token %}
          {% include "parciales/form_campos.html" %}
          <button type="submit" class="btn btn-primario w-100 btn-lg">Registrarme</button>
        </form>
        {% url 'cuentas:login' as url_login %}
        {% if url_login %}
        <p class="text-center mt-3 mb-0">
          ¿Ya tienes cuenta? <a href="{{ url_login }}">Inicia sesión</a>
        </p>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
