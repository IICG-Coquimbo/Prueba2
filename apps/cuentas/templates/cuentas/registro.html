{% extends "base.html" %}

{% block title %}Registro{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h2>Registro</h2>
    <form method="post" action="{% url 'cuentas:registro' %}">
      {% csrf_token %}
      {% include "parciales/form_campos.html" %}
      <button type="submit" class="btn btn-primario btn-lg w-100">Registrarse</button>
    </form>
    <p class="mt-3">
      Ya tienes cuenta? <a href="{% url 'cuentas:login' %}">Inicia sesion</a>
    </p>
  </div>
</div>
{% endblock %}
