{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <h1 class="h3 mb-4">Crear cuenta</h1>
    <form method="post" action="{% url 'cuentas:registro' %}">
      {% csrf_token %}
      {% include "parciales/form_campos.html" %}
      <button type="submit" class="btn btn-primario btn-lg w-100">Crear cuenta</button>
    </form>
    <p class="mt-3">Ya tienes cuenta? <a href="{% url 'cuentas:login' %}">Inicia sesion</a></p>
  </div>
</div>
{% endblock %}
