{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h3 mb-4 text-center">Crear cuenta</h1>
          <form method="post">
            {% csrf_token %}
            {% include "parciales/form_campos.html" %}
            <button type="submit" class="btn btn-acento w-100">Registrarme</button>
          </form>
          <p class="mt-3 mb-0 text-center">
            ¿Ya tienes cuenta? <a href="{% url 'cuentas:login' %}">Inicia sesión aquí</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
