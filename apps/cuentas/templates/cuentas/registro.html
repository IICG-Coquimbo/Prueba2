{% extends "base.html" %}
{% block title %}Registro - Cafe Rincon{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <h1 class="mb-4">Crear cuenta</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "parciales/form_campos.html" %}
      <button type="submit" class="btn btn-primary btn-lg w-100">Registrarse</button>
    </form>
    <p class="mt-3 text-center">
      Ya tienes cuenta? <a href="{% url 'cuentas:login' %}">Iniciar sesion</a>
    </p>
  </div>
</div>
{% endblock %}
