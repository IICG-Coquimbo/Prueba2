{% extends 'base.html' %}
{% block title %}Registro{% endblock %}
{% block content %}
<h2>Registro de cliente</h2>
<form method="post" action="{% url 'cuentas:registro' %}">
    {% csrf_token %}
    {% include "parciales/form_campos.html" %}
    <button type="submit" class="btn btn-primary btn-lg w-100">Registrarse</button>
</form>
<p class="mt-3">Ya tienes cuenta? <a href="{% url 'cuentas:login' %}">Iniciar sesion</a></p>
{% endblock %}
