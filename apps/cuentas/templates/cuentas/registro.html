{% extends "base.html" %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h3 mb-4">Crear cuenta</h1>
          <form method="post" action="{% url 'cuentas:registro' %}">
            {% csrf_token %}
            {% include "parciales/form_campos.html" %}
            <button type="submit" class="btn btn-lg btn-cafe w-100">Registrarme</button>
          </form>
          <hr>
          <a class="btn btn-lg btn-outline-cafe w-100" href="{% url 'cuentas:login' %}">Ya tengo cuenta</a>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
