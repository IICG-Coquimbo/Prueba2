{% extends "base.html" %}
{% block title %}Registrarse - Cafe Rincon{% endblock %}

  <div class="row justify-content-center">
    <div class="col-md-6">
      <h1 class="h3 mb-4">Crear cuenta</h1>

    </div>
  </div>
</div>
{% endblock %}
