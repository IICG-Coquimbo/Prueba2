{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <h1>Crear cuenta</h1>

    <form method="post">
        {% csrf_token %}
        {% include "parciales/form_campos.html" %}
        <button type="submit" class="btn btn-lg btn-primary w-100">Registrarme</button>
    </form>

    <p class="mt-3">
        ¿Ya tienes cuenta? <a href="{% url 'cuentas:login' %}">Inicia sesion</a>
    </p>
</div>
{% endblock %}
