{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1>Crear cuenta</h1>
        <form method="post">
            {% csrf_token %}
            {% include "parciales/form_campos.html" %}
            <button class="btn btn-primary" type="submit">Registrarme</button>
        </form>
        <p class="mt-3">¿Ya tienes cuenta? <a href="{% url 'cuentas:login' %}">Inicia sesión</a>.</p>
    </div>
</div>
{% endblock %}
