{% extends "base.html" %}

{% block title %}Direccion{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h2>{% if object.pk %}Editar direccion{% else %}Nueva direccion{% endif %}</h2>
    <form method="post" action="">
      {% csrf_token %}
      {% include "parciales/form_campos.html" %}
      <button type="submit" class="btn btn-primario btn-lg w-100">Guardar</button>
    </form>
    <a href="{% url 'cuentas:direccion_list' %}" class="btn btn-outline-secondary mt-2 w-100">Volver</a>
  </div>
</div>
{% endblock %}
