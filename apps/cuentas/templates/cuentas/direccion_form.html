{% extends "base.html" %}

{% block content %}
<h1>{% if object %}Editar dirección{% else %}Nueva dirección{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {% include "parciales/form_campos.html" %}
    <button class="btn btn-primary" type="submit">Guardar</button>
    {% if perms.cuentas.view_direccion %}
        <a class="btn btn-outline-secondary" href="{% url 'cuentas:direccion_list' %}">Cancelar</a>
    {% endif %}
</form>
{% endblock %}
