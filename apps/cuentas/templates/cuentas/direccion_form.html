{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <h1 class="h3 mb-4">{% if object.pk %}Editar direccion{% else %}Nueva direccion{% endif %}</h1>
    <form method="post" action="{% if object.pk %}{% url 'cuentas:direccion_update' object.pk %}{% else %}{% url 'cuentas:direccion_create' %}{% endif %}">
      {% csrf_token %}
      {% include "parciales/form_campos.html" %}
      <div class="d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primario btn-lg">Guardar</button>
        <a class="btn btn-outline-secondary btn-lg" href="{% url 'cuentas:direccion_list' %}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
