{% extends "base.html" %}
{% block title %}Dirección - Cafe Rincon{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <h1 class="h3 mb-4">{% if object %}Editar dirección{% else %}Nueva dirección{% endif %}</h1>
      <form method="post">
        {% csrf_token %}
        {% include "parciales/form_campos.html" %}
        <button type="submit" class="btn btn-primary btn-lg">Guardar</button>
        <a href="{% url 'cuentas:direccion_list' %}" class="btn btn-secondary">Cancelar</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
