{% extends "base.html" %}
{% block content %}
<h2>Ranking de repartidores</h2>
<div class="table-responsive">
    <table class="table">
        <thead>
            <tr><th>Repartidor</th><th>Entregas</th><th>Minutos promedio</th></tr>
        </thead>
        <tbody>
            {% for r in ranking %}
            <tr>
                <td>{{ r.repartidor__username }}</td>
                <td>{{ r.entregas }}</td>
                <td>{{ r.minutos_promedio|default:"-" }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="3">Sin datos.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
<a href="{% url 'reportes:reporte_panel' %}" class="btn btn-secondary">Volver a reportes</a>
{% endblock %}
